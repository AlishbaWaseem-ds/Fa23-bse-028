name: CI Pipeline

on:
  push:
    branches: [ "**" ] # Runs on pushes to any branch
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Adjust based on your requirements.txt version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r assignment-portal/requirements.txt
        # If pytest or another test runner is needed:
        pip install pytest

    - name: Run Automated Tests
      run: |
        # Adjust the path to where your test runner script or pytest is located
        pytest assignment-portal/tests/
        # OR if using your custom runner tool:
        # python assignment-portal/tools/run_tests.py
