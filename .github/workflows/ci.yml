name: CI Test and Email Report

on: [push, pull_request]

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r assignment-portal/requirements.txt

      # Step 1: Run your tests (capture result if needed)
      - name: Run Tests
        id: run_tests
        run: |
          python assignment-portal/tools/run_tests.py
        continue-on-error: true # Allows the workflow to proceed to emailing even if tests fail

      # Step 2: Send the Email Report (Triggers on PASS or FAIL)
      - name: Send Email Test Report
        if: always()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }} # Optional: or your configurable email address
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          RUN_RESULT: ${{ steps.run_tests.outcome }}
        run: |
          python assignment-portal/tools/email_report.py